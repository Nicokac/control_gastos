<div class="alert alert-info d-flex flex-column flex-md-row align-items-md-center gap-2 mb-4" role="status">
    <div class="flex-grow-1">
        <i class="bi bi-arrow-repeat me-1"></i><strong>{{ recurring_suggestion.name }}</strong> se repite todos los meses: lo cargaste en los últimos {{ recurring_suggestion.months }} meses por montos parecidos. ¿Lo convertís en gasto fijo para que te recordemos el vencimiento?
    </div>
    <div class="d-flex gap-2 flex-shrink-0">
        <a href="{% url 'recurring:create' %}?suggestion={{ recurring_suggestion.key|urlencode }}" class="btn btn-sm btn-primary">Crear gasto fijo</a>
        <form method="post" action="{% url 'recurring:dismiss_suggestion' %}">
            {% csrf_token %}
            <input type="hidden" name="suggestion" value="{{ recurring_suggestion.key }}">
            <button type="submit" class="btn btn-sm btn-outline-secondary">No, gracias</button>
        </form>
    </div>
</div>
