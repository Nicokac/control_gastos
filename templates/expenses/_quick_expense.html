{% load static %}
<div class="card mb-4 border-danger-subtle" id="quickExpense"
     data-parse-url="{% url 'expenses:quick_parse' %}"
     data-full-form-url="{% url 'expenses:create' %}">
    <div class="card-body py-3">
        <form id="quickExpenseInput" class="d-flex gap-2" autocomplete="off" novalidate>
            <div class="input-group">
                <span class="input-group-text bg-transparent"><i class="bi bi-lightning-charge text-danger" aria-hidden="true"></i></span>
                <input type="text" class="form-control" id="quickExpenseText" maxlength="200"
                       placeholder="Cargá un gasto: 15000 super débito"
                       aria-label="Carga rápida de gasto" aria-describedby="quickExpenseHelp">
            </div>
            <button type="submit" class="btn btn-danger text-nowrap" disabled>Cargar</button>
        </form>
        <div id="quickExpenseHelp" class="form-text">
            Monto, qué compraste y, si querés, cómo pagaste o cuándo: <em>8500 nafta efectivo</em>, <em>20 usd netflix</em>, <em>12000 farmacia ayer</em>.
        </div>
        <div id="quickExpenseError" class="small text-danger mt-2 d-none" role="alert"></div>

        <form id="quickExpensePreview" method="post" action="{% url 'expenses:quick_create' %}" class="d-none mt-3 pt-3 border-top">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            <input type="hidden" name="next" value="{{ next_url }}">
            <input type="hidden" name="amount">
            <input type="hidden" name="currency">
            <input type="hidden" name="exchange_rate">
            <input type="hidden" name="date">
            <input type="hidden" name="payment_method">
            <input type="hidden" name="description">
            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                <span class="fs-5 fw-bold text-danger" data-preview="amount"></span>
                <span class="small text-muted d-none" data-preview="conversion"></span>
                <span class="badge text-bg-light border" data-preview="date"></span>
                <span class="badge text-bg-light border d-none" data-preview="payment"></span>
                <span class="text-muted d-none" data-preview="description"></span>
            </div>
            <div class="row g-2 align-items-center">
                <div class="col-12 col-md-6">
                    <label for="quickExpenseCategory" class="visually-hidden">Categoría</label>
                    <select name="category" id="quickExpenseCategory" class="form-select" required>
                        <option value="">-- Elegí la categoría --</option>
                        {% for item in category_groups %}
                        <optgroup label="{{ item.group.name }}">
                            {% for sub in item.subcategories %}
                            <option value="{{ sub.pk }}">{{ sub.name }}</option>
                            {% endfor %}
                        </optgroup>
                        {% endfor %}
                    </select>
                    <div class="form-text d-none" data-preview="category-hint"></div>
                </div>
                <div class="col-12 col-md-6 d-flex flex-wrap gap-2 justify-content-md-end">
                    <button type="submit" class="btn btn-danger"><i class="bi bi-check-lg me-1" aria-hidden="true"></i>Guardar</button>
                    <a href="#" class="btn btn-outline-secondary" data-preview="full-form">Formulario completo</a>
                    <button type="button" class="btn btn-link text-muted" data-preview="cancel">Cancelar</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script src="{% static 'js/quick_expense.js' %}?v={{ APP_VERSION }}" defer></script>
